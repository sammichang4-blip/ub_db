<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PDB Structure Viewer</title>


    <!-- =========================================
         Mol* CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='molstar/molstar.css') }}"
    >


    <!-- =========================================
         Mol* JS
    ========================================== -->

    <script
        src="{{ url_for('static', filename='molstar/molstar.js') }}"
    ></script>
    <script src="{{ url_for('static', filename='js/molstar-controls.js') }}"></script>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #ffffff;

        }


        #pdb-full-viewer {

            position: absolute;

            inset: 48px 0 0;

            width: 100%;

        }

        #viewer-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1200;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 48px;
            padding: 6px 10px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #d0d5dd;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
        }

        #viewer-toolbar[hidden] {
            display: none;
        }

        #viewer-toolbar button {
            padding: 6px 10px;
            border: 1px solid #c7cdd4;
            border-radius: 5px;
            background: #fff;
            color: #344054;
            cursor: pointer;
        }

        #viewer-toolbar button:hover:not(:disabled) {
            background: #f2f4f7;
        }

        #viewer-toolbar button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #viewer-control-status {
            margin-left: auto;
            color: #667085;
            font-size: 12px;
        }

        #plddt-legend {
            position: fixed;
            top: 54px;
            left: 10px;
            z-index: 1100;
            width: min(340px, calc(100vw - 32px));
            padding: 9px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.96);
            color: #344054;
            font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
        }

        #plddt-legend[hidden] {
            display: none;
        }

        .plddt-legend-gradient {
            height: 10px;
            margin: 6px 0 3px;
            border: 1px solid rgba(52, 64, 84, 0.2);
            border-radius: 5px;
            background: linear-gradient(90deg, #bf2222 0%, #fff 50%, #3361e1 100%);
        }

        .plddt-legend-ticks,
        .plddt-legend-ranges {
            position: relative;
        }

        .plddt-legend-ticks {
            height: 16px;
        }

        .plddt-legend-ticks span {
            position: absolute;
            transform: translateX(-50%);
        }

        .plddt-legend-ticks span:first-child {
            transform: none;
        }

        .plddt-legend-ticks span:last-child {
            transform: translateX(-100%);
        }

        .plddt-legend-ranges {
            margin-top: 5px;
            color: #667085;
            font-size: 10px;
        }

        #pdb-full-viewer:fullscreen {
            inset: 0;
            width: 100vw;
            height: 100vh;
        }


        /* Loading message */

        #viewer-loading {

            position: absolute;

            top: 20px;

            left: 20px;

            z-index: 1000;

            padding: 8px 14px;

            border-radius: 6px;

            background: rgba(0,0,0,0.75);

            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                sans-serif;

            font-size: 14px;

        }


        /* Error message */

        #viewer-error {

            display: none;

            position: absolute;

            top: 20px;

            left: 20px;

            right: 20px;

            z-index: 1000;

            padding: 12px 16px;

            border-radius: 6px;

            background: #fff1f2;

            border: 1px solid #fecdd3;

            color: #9f1239;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                sans-serif;

        }

    </style>

</head>


<body>


    <!-- =========================================
         Mol* container
    ========================================== -->

    <div id="pdb-full-viewer"></div>

    <div id="viewer-toolbar" aria-label="Structure viewer controls">
        <button type="button" data-viewer-action="reset" disabled>Reset view</button>
        <button type="button" data-viewer-action="cartoon" disabled>Cartoon</button>
        <button type="button" data-viewer-action="surface" disabled>Surface</button>
        <button type="button" data-viewer-action="confidence" disabled>pLDDT confidence</button>
        <button type="button" data-viewer-action="fullscreen" disabled>Fullscreen</button>
        <span id="viewer-control-status" role="status" aria-live="polite"></span>
    </div>
    <aside id="plddt-legend" aria-label="AlphaFold pLDDT color ranges" hidden>
        <strong>pLDDT confidence score (0–100)</strong>
        <div class="plddt-legend-gradient" role="img" aria-label="Low scores are red and transition through white to blue at high scores"></div>
        <div class="plddt-legend-ticks" aria-hidden="true">
            <span style="left: 0%">0</span><span style="left: 50%">50</span><span style="left: 70%">70</span><span style="left: 90%">90</span><span style="left: 100%">100</span>
        </div>
        <div class="plddt-legend-ranges">
            &lt;50 Very low · 50–70 Low · 70–90 Confident · ≥90 Very high
        </div>
    </aside>


    <div id="viewer-loading" role="status" aria-live="polite">
        Loading structure...
    </div>


    <div id="viewer-error" role="alert"></div>


<script>

    /*
    =====================================================
    Structure URL — this MUST be the full downloadable path
    (e.g. "/data/pdb/4P22.pdb" or "/data/cif/xxxx.cif"),
    never a bare PDB ID. A bare ID resolves as a relative URL
    against this very page and downloads the HTML page itself,
    which Mol* then fails to parse.
    =====================================================
    */

    const PDB_URL = {{ pdb_url | tojson }};
    const STRUCTURE_SOURCE = {{ structure_source | tojson }};


    console.log(
        "================================"
    );

    console.log(
        "Full PDB Viewer"
    );

    console.log(
        "PDB URL:",
        PDB_URL
    );

    console.log(
        "================================"
    );


    /*
    =====================================================
    Escape HTML
    =====================================================
    */

    function escapeHtml(str) {

        if (
            str === null ||
            str === undefined
        ) {

            return "";

        }

        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /*
    =====================================================
    Show error
    =====================================================
    */

    function showViewerError(message) {

        console.error(
            "PDB Viewer Error:",
            message
        );

        const loading =
            document.getElementById(
                "viewer-loading"
            );

        if (loading) {

            loading.style.display = "none";

        }
        const error =
            document.getElementById(
                "viewer-error"
            );

        if (error) {

            error.style.display = "block";

            error.textContent = "❌ " + message;

        }
        document.getElementById("pdb-full-viewer")?.setAttribute("aria-busy", "false");

        document.querySelectorAll("#viewer-toolbar [data-viewer-action]").forEach(button => {
            button.disabled = true;
        });
        notifyStructureViewerState("error", message);

    }


    /*
    =====================================================
    Hide loading
    =====================================================
    */

    function hideLoading() {

        const loading =
            document.getElementById(
                "viewer-loading"
            );

        if (loading) {

            loading.style.display = "none";

        }
        document.getElementById("pdb-full-viewer")?.setAttribute("aria-busy", "false");

    }

    function setViewerLoading(message) {
        const loading = document.getElementById("viewer-loading");
        const error = document.getElementById("viewer-error");
        if (loading) {
            loading.textContent = message;
            loading.style.display = "block";
        }
        document.getElementById("pdb-full-viewer")?.setAttribute("aria-busy", "true");
        if (error) error.style.display = "none";
        document.querySelectorAll("#viewer-toolbar [data-viewer-action]").forEach(button => {
            button.disabled = true;
        });
        notifyStructureViewerState("loading", message);
    }

    function notifyStructureViewerState(state, message = "") {
        if (window.parent !== window) {
            window.parent.postMessage({
                type: "structure-viewer-state",
                state,
                message
            }, window.location.origin);
        }
    }


    /*
    =====================================================
    Sanity-check the response before handing it to Mol*.
    Catches the case where PDB_URL resolves to a 404 page,
    an empty body, or the wrong page entirely — instead of
    letting Mol* fail deep inside its own internal state
    machine with an unhelpful error.
    =====================================================
    */

    function isLikelyStructureFile(text, format) {

        if (!text || !text.trim()) {

            return false;

        }

        const head =
            text.trimStart().slice(0, 500);

        if (
            /^<(!doctype|html)/i.test(head)
        ) {

            return false;

        }

        if (format === "mmcif") {

            return (
                /^data_/im.test(head) ||
                /^_\w/m.test(head) ||
                head.includes("loop_")
            );

        }

        return /^(HEADER|ATOM|HETATM|REMARK|TITLE|COMPND|MODEL)\b/m.test(head);

    }


    /*
    =====================================================
    Initialize Mol*
    =====================================================
    */

    async function initFullPDBViewer() {

        setViewerLoading("Initializing the Mol* viewer…");
        try {

            console.log(
                "Checking Mol*..."
            );


            if (
                typeof molstar ===
                "undefined"
            ) {

                throw new Error(
                    "Mol* library has not loaded."
                );

            }


            console.log(
                "Mol* library OK"
            );


            if (!PDB_URL) {

                throw new Error(
                    "No PDB URL was specified."
                );

            }


            const container =
                document.getElementById(
                    "pdb-full-viewer"
                );


            if (!container) {

                throw new Error(
                    "Could not find pdb-full-viewer."
                );

            }


            /*
            =============================================
            Determine file type
            =============================================
            */

            const lowerUrl =
                String(PDB_URL)
                    .toLowerCase();


            let format = "pdb";


            if (
                lowerUrl.endsWith(".cif") ||
                lowerUrl.endsWith(".mmcif")
            ) {

                format = "mmcif";

            }


            console.log(
                "Structure format:",
                format
            );


            /*
            =============================================
            Fetch + validate BEFORE creating the viewer,
            so a bad URL fails with a clear message instead
            of a half-initialized Mol* instance.
            =============================================
            */

            console.log(
                "Fetching:",
                PDB_URL
            );


            setViewerLoading("Downloading structure file…");
            let probe;
            try {
                probe = await fetch(PDB_URL);
            } catch (error) {
                throw new Error(`Could not connect to or read the structure file: ${error.message || error}`);
            }


            if (!probe.ok) {

                if (probe.status === 404 || probe.status === 410) {
                    throw new Error(`Structure file not found (HTTP ${probe.status}): ${PDB_URL}`);
                }
                throw new Error(`Structure file request failed (HTTP ${probe.status}): ${PDB_URL}`);

            }


            const rawText =
                await probe.text();


            if (
                !isLikelyStructureFile(
                    rawText,
                    format
                )
            ) {

                console.error(
                    "Response does not look like a",
                    format,
                    "file. First 200 chars:",
                    rawText.slice(0, 200)
                );

                throw new Error(
                    `Invalid file format: the response is not a valid ${format === "mmcif" ? "mmCIF" : "PDB"} structure file.`
                );

            }


            console.log(
                "Fetched content looks valid, creating viewer..."
            );


            /*
            =============================================
            Create viewer
            =============================================
            */

            const viewer =
                await molstar.Viewer.create(

                    "pdb-full-viewer",

                    {

                        layoutIsExpanded: true,

                        layoutShowControls: true,

                        collapseLeftPanel: false,

                        collapseRightPanel: false,

                        viewportShowExpand: true,

                        viewportShowSelectionMode: true

                    }

                );


            console.log(
                "Mol* viewer created:",
                viewer
            );


            /*
            =============================================
            Clear existing structure
            =============================================
            */

            await viewer.plugin.clear();


            /*
            =============================================
            Download (re-fetched by Mol*'s own asset
            manager; the probe above is only a validity
            check, Mol* needs to own the fetch itself)
            =============================================
            */

            console.log(
                "Downloading:",
                PDB_URL
            );


            setViewerLoading("Parsing the structure and creating the 3D view…");
            let data;
            try {
                data = await viewer
                    .plugin
                    .builders
                    .data
                    .download({

                        url: PDB_URL,

                        isBinary: false

                    });
            } catch (error) {
                throw new Error(`Mol* failed to download structure data: ${error.message || error}`);
            }


            console.log(
                "Download complete:",
                data
            );


            /*
            =============================================
            Parse trajectory
            =============================================
            */

            let trajectory;
            try {
                trajectory = await viewer
                    .plugin
                    .builders
                    .structure
                    .parseTrajectory(data, format);
            } catch (error) {
                throw new Error(`Mol* could not parse this structure file: ${error.message || error}`);
            }


            console.log(
                "Trajectory parsed:",
                trajectory
            );


            /*
            =============================================
            Apply default representation
            =============================================
            */

            try {
                await viewer
                    .plugin
                    .builders
                    .structure
                    .hierarchy
                    .applyPreset(trajectory, "default");
            } catch (error) {
                throw new Error(`Mol* failed to create the structure view: ${error.message || error}`);
            }

            window.pdbViewer = viewer;
            setupViewerControls(viewer);

            console.log(
                "Structure loaded successfully"
            );


            hideLoading();
            notifyStructureViewerState("ready");


        }

        catch (error) {

            console.error(
                "================================"
            );

            console.error(
                "Mol* ERROR"
            );

            console.error(
                error
            );

            console.error(
                "================================"
            );


            showViewerError(
                error.message ||
                String(error)
            );

        }

    }

    function setupViewerControls(viewer) {
        const toolbar = document.getElementById("viewer-toolbar");
        const status = document.getElementById("viewer-control-status");
        const confidenceButton = toolbar.querySelector('[data-viewer-action="confidence"]');
        const embedded = window.parent !== window;
        toolbar.hidden = embedded;
        document.getElementById("plddt-legend").hidden = STRUCTURE_SOURCE !== "alphafold"
            || embedded;
        toolbar.querySelectorAll("[data-viewer-action]").forEach(button => {
            button.disabled = false;
        });
        confidenceButton.disabled = STRUCTURE_SOURCE !== "alphafold";
        confidenceButton.title = STRUCTURE_SOURCE === "alphafold"
            ? "Color by the per-residue pLDDT scores in the AlphaFold PDB B-factor field."
            : "pLDDT confidence coloring is not available for this structure source.";

        toolbar.addEventListener("click", async event => {
            const button = event.target.closest("[data-viewer-action]");
            if (!button || button.disabled) return;

            const actions = {
                reset: () => window.molstarControls.resetCamera(viewer),
                cartoon: () => window.molstarControls.setCartoon(viewer),
                surface: () => window.molstarControls.setSurface(viewer),
                confidence: () => window.molstarControls.setConfidence(viewer),
                fullscreen: () => window.molstarControls.toggleFullscreen(document.documentElement)
            };

            button.disabled = true;
            status.textContent = button.dataset.viewerAction === "reset"
                || button.dataset.viewerAction === "fullscreen"
                ? ""
                : "Updating representation…";
            try {
                await actions[button.dataset.viewerAction]();
                status.textContent = "";
            } catch (error) {
                console.error("Mol* viewer control failed:", error);
                status.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    }


    /*
    =====================================================
    Start
    =====================================================
    */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initFullPDBViewer
        );

    }

    else {

        initFullPDBViewer();
    }
</script>
</body>

</html>
